[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "navigate-la-28-server"
version = "1.0.0"
description = "Simplified geospatial navigation API for LA 2028 Olympics tourism using PostGIS"
authors = ["Navigate LA 28 Team <team@navigate-la28.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "server"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: GIS",
]
keywords = ["fastapi", "geospatial", "navigation", "olympics", "la2028", "postgis", "postgresql"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "0.115.13"
uvicorn = "0.34.0"
sqlalchemy = "2.0.36"
asyncpg = "0.30.0"
pydantic = "2.10.3"
pydantic-settings = "2.6.1"
python-jose = "3.3.0"
bcrypt = "4.2.1"
passlib = "1.7.4"
python-multipart = "0.0.20"
python-dotenv = "1.0.1"
alembic = "1.14.0"
psycopg2-binary = "2.9.10"
requests = "2.32.2"
aiosqlite = "0.20.0"

[tool.poetry.group.dev.dependencies]
ruff = "0.6.9"
mypy = "1.13.0"
pre-commit = "4.0.1"
bandit = "1.8.0"
safety = "3.2.11"
pytest = "8.3.4"
pytest-asyncio = "0.25.0"
pytest-cov = "6.0.0"
pytest-mock = "3.14.0"
httpx = "0.28.1"
factory-boy = "3.3.1"
faker = "33.1.0"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "migrations",
    "tests/fixtures",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # warnings
    "I",    # import sorting
    "D",    # pydocstyle
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit (security)
]
ignore = [
    "D100", "D104", "D401",  # relax some strict docstring rules
    "ANN101", "ANN102",       # allow missing self/cls annotations
    "S101",                    # allow asserts in tests/dev
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["config", "models", "routes", "services", "schemas"]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "leaflet.*",
    "yarl.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "scripts/*",
    "*/migrations/*",
    "venv/*",
    ".venv/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B601"]  # Skip assert_used and shell injection (for development)

[tool.bandit.assert_used]
skips = ["**/test_*.py", "**/*_test.py"] 