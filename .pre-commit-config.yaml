repos:
  # Core file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Backend: Ruff + mypy
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^server/.*\.py$
      - id: ruff-format
        files: ^server/.*\.py$

  # Backend: Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^server/.*\.py$
        additional_dependencies: [types-all]

  # Backend: Security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        files: ^server/.*\.py$
        args: [-c, server/pyproject.toml]
        additional_dependencies: ["bandit[toml]"]

  # Backend: Safety CVE check
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.3
    hooks:
      - id: python-safety-dependencies-check
        files: ^server/(pyproject\.toml|poetry\.lock|requirements\.txt)$

  # Frontend: Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.4.2
    hooks:
      - id: prettier
        files: ^client/.*\.(js|jsx|ts|tsx|json|css|scss|md|yaml)$

  # Frontend: ESLint
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.57.1
    hooks:
      - id: eslint
        files: ^client/.*\.(js|jsx|ts|tsx)$
        types: [file]
        additional_dependencies:
          - eslint@8.57.1
          - '@typescript-eslint/eslint-plugin@8.18.2'
          - '@typescript-eslint/parser@8.18.2'
          - eslint-config-react-app@8.0.0
          - eslint-plugin-import@2.32.0
          - eslint-plugin-jsx-a11y@6.10.2
          - eslint-plugin-react@7.37.5
          - eslint-plugin-react-hooks@5.0.0

  # Frontend: TypeScript type check
  - repo: local
    hooks:
      - id: typescript
        name: TypeScript type check
        entry: cd client && pnpm run type-check
        language: system
        types: [file]
        files: ^client/.*\.(ts|tsx)$
        pass_filenames: false

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
